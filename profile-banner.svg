    <text x="50" y="126" fill="#B9F14A" font-size="23" font-weight="700" letter-spacing="1.4">UNITY GAMEPLAY PROGRAMMER</text>
    <text x="50" y="168" fill="#BECBDD" font-size="21">Unity and C# for mobile and PC games</text>
    <rect x="49" y="201" width="181" height="35" rx="8" fill="#1B2B3F" stroke="#31445C"/>
    <text x="65" y="224" fill="#E3EBF5" font-size="16">3 Android releases</text>
    <rect x="242" y="201" width="237" height="35" rx="8" fill="#1B2B3F" stroke="#31445C"/>
